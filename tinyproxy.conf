# tinyproxy 配置：只做内网转发代理
# 监听本机 8888；对外暴露经 tailscale serve（内网 8888），不直接对外网开放。
User nobody
Group nogroup
Port 8888
Listen 127.0.0.1
Timeout 600
LogLevel Connect
PidFile "/tmp/tinyproxy.pid"
MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 5
# CONNECT 允许的端口（https/http/常见备用端口）
ConnectPort 443
ConnectPort 80
ConnectPort 8080
ConnectPort 8443
